<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Full-screen background images */
        .bg-slideshow {
            position: fixed; inset: 0; z-index: 0;
        }
        .bg-slide {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
            transform: scale(1.02);
            animation: slowDrift 25s ease-in-out infinite alternate;
        }
        .bg-slide.active { opacity: 1; }
        @keyframes slowDrift {
            0% { transform: scale(1.0) translateX(0); }
            50% { transform: scale(1.04) translateX(-0.5%); }
            100% { transform: scale(1.02) translateX(0.5%); }
        }

        /* Dark background */
        .bg-overlay {
            position: fixed; inset: 0; z-index: 1;
            background: linear-gradient(135deg, #0f0c29 0%, #1a1a3e 30%, #24243e 60%, #1a1a3e 100%);
        }

        /* Subtle grid pattern */
        .bg-pattern {
            position: fixed; inset: 0; z-index: 2;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(57,73,171,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(124,77,255,0.06) 0%, transparent 40%),
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
            pointer-events: none;
        }

        /* Login container */
        .login-wrapper {
            position: relative; z-index: 10;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%; max-width: 420px;
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 80px rgba(57,73,171,0.1);
            animation: cardAppear 0.8s ease-out;
        }
        @keyframes cardAppear {
            0% { opacity: 0; transform: translateY(20px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-logo i {
            font-size: 2.5rem;
            color: #7c9dff;
            display: block;
            margin-bottom: 12px;
        }
        .login-logo h4 {
            color: #e0e0e0;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .login-logo p {
            color: #777;
            font-size: 0.8rem;
        }

        .form-floating {
            margin-bottom: 18px;
        }
        .form-floating > .form-control {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            color: #e0e0e0;
            height: 52px;
            padding-top: 22px;
        }
        .form-floating > .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: rgba(124,157,255,0.5);
            box-shadow: 0 0 0 3px rgba(124,157,255,0.15);
            color: #fff;
        }
        .form-floating > label {
            color: #888;
            padding-top: 14px;
        }
        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #7c9dff;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            background: linear-gradient(135deg, #3949ab 0%, #5c6bc0 100%);
            border: none;
            color: #fff;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #5c6bc0 0%, #7986cb 100%);
            box-shadow: 0 6px 20px rgba(57,73,171,0.4);
            transform: translateY(-1px);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .btn-login:disabled {
            opacity: 0.6;
            transform: none;
        }

        .login-error {
            background: rgba(198,40,40,0.12);
            border: 1px solid rgba(198,40,40,0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: #ef9a9a;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }
        .login-error.show { display: block; animation: shake 0.4s; }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #555;
            font-size: 0.7rem;
        }

        /* Image indicator dots */
        .slide-dots {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
        }
        .slide-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.5s;
        }
        .slide-dot.active {
            background: rgba(124,157,255,0.7);
            width: 20px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Background (clean, no images) -->
    <div class="bg-overlay"></div>
    <div class="bg-pattern"></div>

    <!-- Login Form -->
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <i class="bi bi-gear-wide-connected"></i>
                <h4>{{ title }}</h4>
                <p>AI Powered Motor Rewinding Quotation System</p>
            </div>

            <div class="login-error" id="loginError">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span id="errorMsg">Invalid credentials</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-floating">
                    <input type="text" class="form-control" id="username" placeholder="Username" required autocomplete="username">
                    <label for="username"><i class="bi bi-person me-2"></i>Username</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required autocomplete="current-password">
                    <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
                </div>
                <button type="submit" class="btn btn-login" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="login-footer">
                <i class="bi bi-shield-lock me-1"></i>
                Secure access · Industrial AI - Quotation Intelligence
            </div>
        </div>
    </div>

    <script>
    // Login handler
    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errorDiv = document.getElementById('loginError');
        errorDiv.classList.remove('show');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();

            if (data.success) {
                btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>Welcome!';
                btn.style.background = 'linear-gradient(135deg, #2e7d32, #4caf50)';
                setTimeout(() => { window.location.href = '/'; }, 600);
            } else {
                errorDiv.classList.add('show');
                document.getElementById('errorMsg').textContent = data.error || 'Invalid credentials';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
            }
        } catch (err) {
            errorDiv.classList.add('show');
            document.getElementById('errorMsg').textContent = 'Connection error';
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';
        }
    }
    </script>
</body>
</html>
